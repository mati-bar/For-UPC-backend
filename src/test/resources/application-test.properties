
# ==========================================
# FOR-UPC - CONFIGURACION DE PRUEBAS JUNIT
# ==========================================

spring.application.name=For-Upc_backend-test

# BASE DE DATOS H2 - SOLO TESTS
spring.datasource.url=jdbc:h2:mem:forupctest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT - CLAVE EXCLUSIVA PARA PRUEBAS EN BASE64
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# CORS
app.cors.allowed-origins=http://localhost:5173

# SUPABASE - VALORES FICTICIOS
supabase.url=http://localhost:9999
supabase.service-key=test-only
supabase.storage.bucket=for-upc-test

# RECUPERACION DE CONTRASENA
app.password-reset.test-mode=true
app.password-reset-url=http://localhost:5173/reset-password

# BREVO - VALORES FICTICIOS
brevo.api-key=test-only
brevo.sender-email=test@example.com
brevo.sender-name=For UPC Test
