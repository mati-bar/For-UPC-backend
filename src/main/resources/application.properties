
# ==========================================
# FOR-UPC BACKEND
# ==========================================

spring.application.name=For-Upc_backend

# ==========================================
# SERVIDOR - RENDER
# ==========================================

server.port=${PORT:8080}
server.address=0.0.0.0

# ==========================================
# BASE DE DATOS - SUPABASE POSTGRESQL
# ==========================================

spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ypaaxwgfnadvbulfdbjn
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Inicializacion SQL
spring.sql.init.mode=never

# ==========================================
# SEGURIDAD - JWT
# ==========================================

jwt.secret=${JWT_SECRET}

# ==========================================
# SUPABASE STORAGE
# ==========================================

supabase.url=https://ypaaxwgfnadvbulfdbjn.supabase.co
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=for-upc

# ==========================================
# ARCHIVOS MULTIPART
# ==========================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=INFO

# ==========================================
# CORS - FRONTEND
# ==========================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# RECUPERACION DE CONTRASENA
# ==========================================

app.password-reset.test-mode=false
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}

# ==========================================
# BREVO - EMAIL TRANSACCIONAL
# ==========================================

brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=For UPC
